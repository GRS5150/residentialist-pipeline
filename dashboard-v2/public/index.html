<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Residentialist — Product Intelligence</title>
  <meta name="description" content="Internal product intelligence dashboard for the Residentialist database. View categories, products, scores, evidence, and audit results.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header id="site-header">
    <div class="header-left">
      <div class="logo">THE <span>RESIDENTIALIST</span></div>
      <div class="header-sep"></div>
      <div class="header-subtitle">Product Intelligence</div>
    </div>
    <div class="header-right">
      <button id="refresh-btn" class="header-btn" title="Refresh data from filesystem">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
      <div id="header-meta" class="header-meta">
        <span class="meta-dot"></span>
        <span id="meta-text">Loading...</span>
      </div>
    </div>
  </header>

  <nav id="breadcrumb" class="breadcrumb" style="display:none;">
    <a href="#/" class="crumb-link">All Categories</a>
    <span id="crumb-category" class="crumb-item" style="display:none;">
      <span class="crumb-sep">›</span>
      <a href="#/" class="crumb-link" id="crumb-category-link"></a>
    </span>
    <span id="crumb-product" class="crumb-item" style="display:none;">
      <span class="crumb-sep">›</span>
      <span class="crumb-current" id="crumb-product-name"></span>
    </span>
  </nav>

  <main id="app">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading product data...</p>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
