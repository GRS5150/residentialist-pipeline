<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curation — The Residentialist</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px 28px; display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    header .subtitle { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    header nav { margin-left: auto; display: flex; gap: 8px; }
    header nav a { color: rgba(255,255,255,0.8); text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; transition: all 0.15s; }
    header nav a:hover, header nav a.active { background: rgba(255,255,255,0.2); color: white; }
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    .page-title { font-size: 22px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
    .page-sub { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }
    .category-tabs { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
    .cat-tab { padding: 7px 18px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
    .cat-tab.active { background: #667eea; border-color: #667eea; color: white; }
    .cat-tab:hover:not(.active) { border-color: #667eea; color: #c7d2fe; }
    .product-grid { display: flex; flex-direction: column; gap: 10px; }
    .product-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; transition: all 0.15s; cursor: pointer; }
    .product-card:hover { border-color: #667eea; background: #243251; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(102,126,234,0.15); }
    .product-card .pname { font-size: 15px; font-weight: 600; color: #f1f5f9; flex: 1; }
    .product-card .pmfr { font-size: 12px; color: #64748b; margin-top: 2px; }
    .product-card .pscore { font-size: 22px; font-weight: 800; color: #667eea; min-width: 52px; text-align: right; }
    .product-card .pscore.none { color: #475569; font-size: 14px; font-weight: 500; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
    .badge.curated { background: #065f46; color: #6ee7b7; }
    .badge.staged { background: #78350f; color: #fcd34d; }
    .badge.released { background: #1e3a5f; color: #93c5fd; }
    .source-counts { display: flex; gap: 8px; font-size: 12px; color: #64748b; }
    .source-counts span { color: #94a3b8; }
    .source-counts .cnt { font-weight: 700; color: #c7d2fe; }
    .empty { text-align: center; padding: 60px 20px; color: #475569; }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .loading { text-align: center; padding: 60px; color: #64748b; }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #334155; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { text-align: center; padding: 40px; color: #f87171; }
    .score-bar { width: 80px; height: 6px; background: #1e293b; border-radius: 3px; margin-top: 4px; }
    .score-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.4s; }
    .pool-pills { display: flex; gap: 4px; }
    .pill { padding: 2px 7px; border-radius: 8px; font-size: 10px; font-weight: 700; }
    .pill.S { background: #4c1d95; color: #c4b5fd; }
    .pill.A { background: #1e3a5f; color: #93c5fd; }
    .pill.B { background: #1e293b; color: #64748b; }
    .pill.C { background: #27272a; color: #52525b; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>THE RESIDENTIALIST · Curation</h1>
      <div class="subtitle">Source review & scoring verification</div>
    </div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/curation" class="active">Curation</a>
    </nav>
  </header>

  <div class="container">
    <div class="page-title">Source Curation</div>
    <div class="page-sub">Review sources, check pool distribution, and verify scoring before launch.</div>

    <div class="category-tabs" id="categoryTabs"></div>
    <div class="product-grid" id="productGrid">
      <div class="loading"><div class="spinner"></div><br>Loading products…</div>
    </div>
  </div>

  <script>
    const API = '';
    let currentCategory = 'windows';
    let allProducts = [];

    async function loadCategories() {
      // For now we have windows. Expand later.
      const categories = ['windows'];
      const tabs = document.getElementById('categoryTabs');
      tabs.innerHTML = categories.map(c =>
        `<div class="cat-tab ${c === currentCategory ? 'active' : ''}" onclick="switchCategory('${c}')">${c.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</div>`
      ).join('');
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase().replace(/ /g,'_') === cat || t.textContent.toLowerCase().replace(/ /g,' ') === cat.replace(/_/g,' ')));
      loadProducts();
    }

    async function loadProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '<div class="loading"><div class="spinner"></div><br>Loading…</div>';
      try {
        const res = await fetch(`${API}/api/calibration/${currentCategory}/products`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allProducts = await res.json();
        renderProducts(allProducts);
      } catch(e) {
        grid.innerHTML = `<div class="err">⚠ Failed to load: ${e.message}</div>`;
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      if (!products.length) {
        grid.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><p>No products found for this category.</p></div>';
        return;
      }
      grid.innerHTML = products.map(p => {
        const score = p.overall_score;
        const scoreHtml = score
          ? `<div class="pscore">${score}<div class="score-bar"><div class="score-bar-fill" style="width:${score}%"></div></div></div>`
          : `<div class="pscore none">unscored</div>`;
        const pools = p.pool_distribution || {};
        const poolPills = Object.entries(pools)
          .filter(([k,v]) => v > 0)
          .map(([k,v]) => `<span class="pill ${k.replace('pool_','')}">${k.replace('pool_','')}:${v}</span>`)
          .join('');
        return `
          <div class="product-card" onclick="openProduct('${p.slug}', '${currentCategory}')">
            <div style="flex:1">
              <div class="pname">${p.product_name}</div>
              <div class="pmfr">${p.manufacturer_slug || ''}</div>
              <div class="source-counts" style="margin-top:6px">
                <span>Sources: <span class="cnt">${p.source_count || 0}</span></span>
                <span>· Scored: <span class="cnt">${p.scored_count || 0}</span></span>
                <span>· Quarantined: <span class="cnt">${p.quarantined_count || 0}</span></span>
                ${poolPills ? `<span style="margin-left:4px">${poolPills}</span>` : ''}
              </div>
            </div>
            <div style="text-align:right">
              ${scoreHtml}
              <div style="margin-top:6px"><span class="badge ${p.curation_status || 'staged'}">${p.curation_status || 'staged'}</span></div>
            </div>
          </div>`;
      }).join('');
    }

    function openProduct(slug, category) {
      window.location.href = `/curation-product.html?slug=${slug}&category=${category}`;
    }

    loadCategories();
    loadProducts();
  </script>
</body>
</html>
