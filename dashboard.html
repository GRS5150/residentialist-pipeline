<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Residentialist — Mission Control</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --amber: #B8722A;
    --ink: #1a1a1a;
    --ink-mid: #555;
    --ink-faint: #999;
    --rule: #e0dbd4;
    --bg: #f5f3ef;
    --white: #ffffff;
    --green: #2d6a4f;
    --red: #9b2226;
    --yellow-bg: #fef3c7;
    --yellow-border: #d97706;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh; }

  header { background: var(--ink); color: var(--white); padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .logo span { color: var(--amber); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; display: inline-block; margin-right: 6px; }
  .status-dot.live { background: #10b981; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .header-status { font-size: 11px; color: #9ca3af; display: flex; align-items: center; gap: 4px; }

  .container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

  .section-label { font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 12px; margin-top: 28px; }

  /* Score table */
  .score-table { width: 100%; border-collapse: collapse; background: var(--white);
    border: 1px solid var(--rule); }
  .score-table th { font-size: 9px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
    color: var(--ink-faint); padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--rule);
    background: #faf9f7; }
  .score-table td { padding: 12px 12px; font-size: 13px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .score-table tr:last-child td { border-bottom: none; }
  .score-table tr.clickable { cursor: pointer; }
  .score-table tr.clickable:hover td { background: #faf9f7; }
  .score-table tr.expanded td { background: #fdf8f2; }

  .product-name { font-weight: 600; font-size: 14px; }
  .product-meta { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  .score-num { font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
  .score-grade { font-size: 10px; font-weight: 700; color: var(--ink-faint); margin-top: 3px; letter-spacing: .05em; }
  .score-col { text-align: right; }

  .status-badge { display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 10px;
    font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .badge-pass { background: #d1fae5; color: #065f46; }
  .badge-halted { background: #fee2e2; color: #991b1b; }
  .badge-unknown { background: #f3f4f6; color: #6b7280; }
  .badge-running { background: #fef3c7; color: #92400e; }
  .badge-cal { background: #e0d9f0; color: #4c1d95; }

  /* Drill-down panel */
  .drill-row td { padding: 0 !important; }
  .drill-panel { padding: 16px 20px 20px; border-top: 2px solid var(--amber); background: #fdf8f2; }
  .drill-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 560px) { .drill-grid { grid-template-columns: 1fr; } }

  .axis-card { background: var(--white); border: 1px solid var(--rule); padding: 14px; }
  .axis-label { font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 8px; }
  .axis-score { font-size: 28px; font-weight: 300; line-height: 1; }
  .axis-grade { font-size: 10px; color: var(--ink-faint); margin-top: 2px; font-weight: 700; }
  .axis-weight { font-size: 10px; color: var(--ink-faint); margin-bottom: 6px; }
  .axis-bar-track { height: 4px; background: var(--rule); border-radius: 2px; margin-top: 10px; }
  .axis-bar-fill { height: 4px; border-radius: 2px; transition: width .4s ease; }

  .drill-meta { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 4px; }
  .drill-meta-item { font-size: 11px; color: var(--ink-mid); }
  .drill-meta-item strong { color: var(--ink); }

  .chevron { font-size: 10px; color: var(--ink-faint); transition: transform .2s; display: inline-block; }
  .chevron.open { transform: rotate(180deg); }

  .refresh-btn { background: var(--amber); color: var(--white); border: none; padding: 8px 16px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer; border-radius: 3px; }
  .refresh-btn:hover { background: #9a5e22; }

  .pipeline-bar { background: var(--white); border: 1px solid var(--rule); padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .pipeline-stats { display: flex; gap: 20px; }
  .stat { text-align: center; }
  .stat-num { font-size: 24px; font-weight: 300; line-height: 1; }
  .stat-label { font-size: 9px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
    color: var(--ink-faint); margin-top: 2px; }

  .error-msg { color: var(--red); font-size: 12px; padding: 12px; background: #fff5f5;
    border: 1px solid #fed7d7; }
  .loading { color: var(--ink-faint); font-size: 12px; padding: 20px; text-align: center; }

  .col-product { width: 45%; }
  .col-status  { width: 20%; }
  .col-score   { width: 20%; }
  .col-chevron { width: 5%; text-align: center; }

  .timestamp { font-size: 10px; color: var(--ink-faint); }

  /* Mobile tweaks */
  @media (max-width: 600px) {
    .score-num { font-size: 18px; }
    .col-product { width: 50%; }
    .col-status { display: none; }
    .col-score { width: 30%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">The <span>Residentialist</span> · Mission Control</div>
  <div class="header-status">
    <span class="status-dot" id="conn-dot"></span>
    <span id="conn-label">connecting...</span>
  </div>
</header>

<div class="container">

  <!-- Pipeline summary bar -->
  <div class="section-label" style="margin-top:20px">Pipeline</div>
  <div class="pipeline-bar">
    <div class="pipeline-stats">
      <div class="stat"><div class="stat-num" id="stat-complete">—</div><div class="stat-label">Complete</div></div>
      <div class="stat"><div class="stat-num" id="stat-halted" style="color:#ef4444">—</div><div class="stat-label">Halted</div></div>
      <div class="stat"><div class="stat-num" id="stat-cal">—</div><div class="stat-label">Calibrated</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="timestamp" id="last-updated"></div>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>
  </div>

  <!-- Calibration benchmarks -->
  <div class="section-label">Calibration Benchmarks</div>
  <table class="score-table">
    <thead>
      <tr>
        <th class="col-product">Product</th>
        <th class="col-status">Tier</th>
        <th class="col-score">Score</th>
        <th class="col-chevron"></th>
      </tr>
    </thead>
    <tbody id="cal-tbody">
      <tr><td colspan="4" class="loading">Loading...</td></tr>
    </tbody>
  </table>

  <!-- Evaluations -->
  <div class="section-label">Evaluations</div>
  <div id="error-msg"></div>
  <table class="score-table">
    <thead>
      <tr>
        <th class="col-product">Product</th>
        <th class="col-status">Status</th>
        <th class="col-score">Score</th>
        <th class="col-chevron"></th>
      </tr>
    </thead>
    <tbody id="eval-tbody">
      <tr><td colspan="4" class="loading">Loading...</td></tr>
    </tbody>
  </table>

</div>

<script>
const BRIDGE = '';  // served from bridge, use relative URLs
const API_KEY = 'residentialist-bridge-2026';
let expandedRow = null;

function gradeColor(score) {
  if (!score) return '#9ca3af';
  if (score >= 8.0) return '#10b981';
  if (score >= 7.0) return '#3b82f6';
  if (score >= 6.0) return '#f59e0b';
  if (score >= 5.0) return '#ef8c34';
  return '#ef4444';
}

function barColor(score) {
  if (!score) return '#e5e7eb';
  if (score >= 8.0) return '#10b981';
  if (score >= 7.0) return '#3b82f6';
  if (score >= 6.0) return '#f59e0b';
  return '#ef4444';
}

function tierLabel(overall) {
  if (!overall) return '—';
  if (overall >= 8.5) return 'High Performance';
  if (overall >= 7.0) return 'Architectural';
  if (overall >= 5.5) return 'Premium Residential';
  if (overall >= 4.0) return 'Mid-Range';
  return 'Budget';
}

function drillHTML(item, isCalibration) {
  const Q = item.Q, D = item.D, P = item.P;
  const hasSubs = Q !== null && D !== null && P !== null;
  const axes = [
    { label: 'Quality',     weight: '35%', score: Q },
    { label: 'Durability',  weight: '35%', score: D },
    { label: 'Performance', weight: '30%', score: P },
  ];
  return `
    <div class="drill-panel">
      <div class="drill-meta">
        ${item.overall ? `<div class="drill-meta-item">Overall: <strong>${item.overall.toFixed(2)} / 10</strong></div>` : ''}
        ${item.tier || item.overall ? `<div class="drill-meta-item">Tier: <strong>${item.tier || tierLabel(item.overall)}</strong></div>` : ''}
        ${item.ts ? `<div class="drill-meta-item">Scored: <strong>${item.ts.slice(0,10)}</strong></div>` : ''}
      </div>
      ${hasSubs ? `
      <div class="drill-grid">
        ${axes.map(a => `
          <div class="axis-card">
            <div class="axis-label">${a.label}</div>
            <div class="axis-weight">${a.weight} of overall</div>
            <div class="axis-score" style="color:${gradeColor(a.score)}">${a.score ? a.score.toFixed(2) : '—'}</div>
            <div class="axis-bar-track">
              <div class="axis-bar-fill" style="width:${a.score ? (a.score/10*100) : 0}%;background:${barColor(a.score)}"></div>
            </div>
          </div>`).join('')}
      </div>` : `<div style="font-size:12px;color:var(--ink-faint);margin-top:12px">Axis scores not yet available for this product.</div>`}
    </div>`;
}

function renderCalibration(data) {
  const tbody = document.getElementById('cal-tbody');
  if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="loading">No calibration data</td></tr>'; return; }

  let html = '';
  data.forEach((item, idx) => {
    const rowId = 'cal-' + idx;
    html += `
      <tr class="clickable ${expandedRow === rowId ? 'expanded' : ''}" onclick="toggleRow('${rowId}', this)">
        <td><div class="product-name">${item.product}</div><div class="product-meta">${item.config} · Calibration Benchmark</div></td>
        <td><span class="status-badge badge-cal">${tierLabel(item.overall)}</span></td>
        <td class="score-col">
          <div class="score-num" style="color:${gradeColor(item.overall)}">${item.overall ? item.overall.toFixed(2) : '—'}</div>
          <div class="score-grade">${item.grade || '—'}</div>
        </td>
        <td class="col-chevron"><span class="chevron ${expandedRow === rowId ? 'open' : ''}">▼</span></td>
      </tr>`;
    if (expandedRow === rowId) {
      html += `<tr class="drill-row" id="drill-${rowId}"><td colspan="4">${drillHTML(item, true)}</td></tr>`;
    }
  });
  tbody.innerHTML = html;
}

function statusBadge(state) {
  if (!state) return '<span class="status-badge badge-unknown">Unknown</span>';
  const s = state.toUpperCase();
  if (s.includes('PASS')) return '<span class="status-badge badge-pass">Pass</span>';
  if (s.includes('HALT')) return '<span class="status-badge badge-halted">Halted</span>';
  if (s.includes('RUNNING') || s.includes('PROCESS')) return '<span class="status-badge badge-running">Running</span>';
  return `<span class="status-badge badge-unknown">${state.slice(0,12)}</span>`;
}

function renderEvaluations(evals) {
  const tbody = document.getElementById('eval-tbody');
  if (!evals || evals.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="loading">No evaluations found</td></tr>'; return; }

  // Deduplicate — keep most recent run per product
  const seen = new Map();
  for (const e of evals) {
    const key = e.product.toLowerCase().replace(/\s+/g, '_');
    if (!seen.has(key) || e.ts > seen.get(key).ts) seen.set(key, e);
  }
  const unique = Array.from(seen.values()).sort((a,b) => (b.overall||0) - (a.overall||0));

  let pass = 0, halted = 0;
  let html = '';
  unique.forEach((item, idx) => {
    const rowId = 'eval-' + idx;
    const state = (item.state||'').toUpperCase();
    if (state.includes('PASS')) pass++;
    if (state.includes('HALT')) halted++;
    html += `
      <tr class="clickable ${expandedRow === rowId ? 'expanded' : ''}" onclick="toggleRow('${rowId}', this)">
        <td><div class="product-name">${item.product}</div><div class="product-meta">${item.config} · ${item.ts ? item.ts.slice(0,10) : ''}</div></td>
        <td>${statusBadge(item.state)}</td>
        <td class="score-col">
          <div class="score-num" style="color:${gradeColor(item.overall)}">${item.overall ? item.overall.toFixed(2) : '—'}</div>
          <div class="score-grade">${item.grade || (item.overall ? '' : '—')}</div>
        </td>
        <td class="col-chevron"><span class="chevron ${expandedRow === rowId ? 'open' : ''}">▼</span></td>
      </tr>`;
    if (expandedRow === rowId) {
      html += `<tr class="drill-row" id="drill-${rowId}"><td colspan="4">${drillHTML(item, false)}</td></tr>`;
    }
  });

  tbody.innerHTML = html;
  document.getElementById('stat-complete').textContent = pass;
  document.getElementById('stat-halted').textContent = halted;
}

function toggleRow(rowId, clickedTr) {
  if (expandedRow === rowId) {
    expandedRow = null;
  } else {
    expandedRow = rowId;
  }
  // Re-render both tables to reflect new state
  if (window._lastData) {
    renderCalibration(window._lastData.calibration);
    renderEvaluations(window._lastData.evaluations);
  }
}

async function loadData() {
  const dot = document.getElementById('conn-dot');
  const label = document.getElementById('conn-label');
  dot.className = 'status-dot';
  label.textContent = 'loading...';
  document.getElementById('error-msg').textContent = '';

  try {
    const res = await fetch(BRIDGE + '/pipeline', {
      headers: { 'x-api-key': API_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    window._lastData = data;

    dot.className = 'status-dot live';
    label.textContent = 'live';
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    document.getElementById('stat-cal').textContent = data.calibration ? data.calibration.length : 0;

    renderCalibration(data.calibration || []);
    renderEvaluations(data.evaluations || []);
  } catch(e) {
    dot.className = 'status-dot';
    label.textContent = 'offline';
    document.getElementById('error-msg').innerHTML =
      `<div class="error-msg">Could not reach bridge: ${e.message}</div>`;
    document.getElementById('eval-tbody').innerHTML =
      '<tr><td colspan="4" class="loading">—</td></tr>';
  }
}

loadData();
</script>
</body>
</html>
